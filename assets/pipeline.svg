<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="LeadBridge pipeline: webhook, normalize, dedupe, classify, CRM upsert, SEO audit, with duplicate and failure branches">
  <title>LeadBridge pipeline</title>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#101932"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#5EEAD4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#334768"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="16" fill="url(#pbg)"/>

  <!-- ===================== n8n lane ===================== -->
  <rect x="28" y="28" width="1144" height="196" rx="12" fill="#0E1730" stroke="#1E2B4A" stroke-width="1.5"/>
  <text x="48" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" fill="#F472B6" letter-spacing="1.5">n8n &#8212; ORCHESTRATION</text>

  <!-- connectors -->
  <g stroke="#334768" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M168 120 H214"/>
    <path d="M330 120 H376"/>
    <path d="M492 120 H538"/>
    <path d="M654 120 H700"/>
    <path d="M816 120 H862"/>
    <path d="M978 120 H1024"/>
  </g>

  <!-- animated flow overlay -->
  <path d="M168 120 H1024" stroke="url(#flow)" stroke-width="2.5" fill="none" stroke-dasharray="120 736">
    <animate attributeName="stroke-dashoffset" values="856;-120" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- stage boxes -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Webhook -->
    <g>
      <rect x="48" y="90" width="120" height="60" rx="10" fill="#132043" stroke="#38BDF8" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="5s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="108" y="118" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Webhook</text>
      <text x="108" y="136" font-size="11" fill="#64748B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">POST</text>
    </g>
    <!-- Normalize -->
    <g>
      <rect x="214" y="90" width="116" height="60" rx="10" fill="#132043" stroke="#38BDF8" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="5s" begin="0.7s" repeatCount="indefinite"/>
      </rect>
      <text x="272" y="116" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Normalize</text>
      <text x="272" y="134" font-size="10" fill="#64748B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">E.164 &#183; sha256</text>
    </g>
    <!-- Dedupe -->
    <g>
      <rect x="376" y="90" width="116" height="60" rx="10" fill="#132043" stroke="#38BDF8" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="5s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="434" y="116" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Dedupe</text>
      <text x="434" y="134" font-size="10" fill="#64748B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">3 layers</text>
    </g>
    <!-- Classify -->
    <g>
      <rect x="538" y="90" width="116" height="60" rx="10" fill="#141C3F" stroke="#60A5FA" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="5s" begin="2.1s" repeatCount="indefinite"/>
      </rect>
      <text x="596" y="116" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Classify</text>
      <text x="596" y="134" font-size="10" fill="#64748B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">LLM &#183; fallback</text>
    </g>
    <!-- CRM -->
    <g>
      <rect x="700" y="90" width="116" height="60" rx="10" fill="#171640" stroke="#A78BFA" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="5s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
      <text x="758" y="116" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">CRM Upsert</text>
      <text x="758" y="134" font-size="10" fill="#64748B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">HubSpot v3</text>
    </g>
    <!-- SEO -->
    <g>
      <rect x="862" y="90" width="116" height="60" rx="10" fill="#171640" stroke="#A78BFA" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="5s" begin="3.5s" repeatCount="indefinite"/>
      </rect>
      <text x="920" y="116" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">SEO Audit</text>
      <text x="920" y="134" font-size="10" fill="#64748B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">robots &#183; CWV</text>
    </g>
    <!-- Respond -->
    <g>
      <rect x="1024" y="90" width="120" height="60" rx="10" fill="#0F2A24" stroke="#34D399" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="5s" begin="4.2s" repeatCount="indefinite"/>
      </rect>
      <text x="1084" y="118" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Respond</text>
      <text x="1084" y="136" font-size="10" fill="#64748B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">202</text>
    </g>
  </g>

  <!-- travelling packet across the lane -->
  <circle r="6" fill="#5EEAD4" filter="url(#pglow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M108 120 H1084"/>
  </circle>
  <circle r="3" fill="#F0FDFA">
    <animateMotion dur="5s" repeatCount="indefinite" path="M108 120 H1084"/>
  </circle>

  <!-- branch: duplicate -->
  <g stroke="#F59E0B" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M434 150 V186 H1024 V150" marker-end="url(#arrow)"/>
  </g>
  <text x="700" y="180" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#F59E0B" text-anchor="middle">
    duplicate &#8594; skip, no second contact
  </text>

  <!-- ===================== service lane ===================== -->
  <rect x="28" y="248" width="1144" height="154" rx="12" fill="#0E1730" stroke="#1E2B4A" stroke-width="1.5"/>
  <text x="48" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" fill="#5EEAD4" letter-spacing="1.5">FASTAPI SERVICE &#8212; LOGIC, TESTED</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
    <g>
      <rect x="48" y="294" width="176" height="46" rx="9" fill="#132043" stroke="#1E3A5F"/>
      <text x="136" y="313" fill="#CBD5E1" text-anchor="middle" font-weight="600">normalize &#183; dedupe</text>
      <text x="136" y="330" fill="#64748B" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">pure, no I/O</text>
    </g>
    <g>
      <rect x="240" y="294" width="176" height="46" rx="9" fill="#132043" stroke="#1E3A5F"/>
      <text x="328" y="313" fill="#CBD5E1" text-anchor="middle" font-weight="600">providers/</text>
      <text x="328" y="330" fill="#64748B" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">anthropic + mock</text>
    </g>
    <g>
      <rect x="432" y="294" width="176" height="46" rx="9" fill="#132043" stroke="#1E3A5F"/>
      <text x="520" y="313" fill="#CBD5E1" text-anchor="middle" font-weight="600">crm/</text>
      <text x="520" y="330" fill="#64748B" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">hubspot + twin</text>
    </g>
    <g>
      <rect x="624" y="294" width="176" height="46" rx="9" fill="#132043" stroke="#1E3A5F"/>
      <text x="712" y="313" fill="#CBD5E1" text-anchor="middle" font-weight="600">seo/</text>
      <text x="712" y="330" fill="#64748B" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">rules engine</text>
    </g>
    <g>
      <rect x="816" y="294" width="176" height="46" rx="9" fill="#132043" stroke="#1E3A5F"/>
      <text x="904" y="313" fill="#CBD5E1" text-anchor="middle" font-weight="600">http.py</text>
      <text x="904" y="330" fill="#64748B" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">retry &#183; jitter</text>
    </g>
    <g>
      <rect x="1008" y="294" width="136" height="46" rx="9" fill="#132043" stroke="#1E3A5F"/>
      <text x="1076" y="313" fill="#CBD5E1" text-anchor="middle" font-weight="600">db.py</text>
      <text x="1076" y="330" fill="#64748B" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">run log</text>
    </g>
  </g>

  <text x="600" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#475569" text-anchor="middle">
    every stage above is one HTTP call into the service &#183; 127 offline tests
  </text>

  <!-- pulse linking the two lanes -->
  <g stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.7">
    <path d="M272 150 V294"/>
    <path d="M596 150 V294"/>
    <path d="M920 150 V294"/>
  </g>
</svg>
